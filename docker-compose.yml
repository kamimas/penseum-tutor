services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - DRAW_SERVER_URL=http://draw-server:5001
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - draw-server

  draw-server:
    build: ./agent
    ports:
      - "5001:5001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./agent/draw_server.py:/app/draw_server.py
      - ./agent/draw_subagent.py:/app/draw_subagent.py
      - ./agent/p5js:/app/p5js
    command: uvicorn draw_server:app --host 0.0.0.0 --port 5001 --reload
